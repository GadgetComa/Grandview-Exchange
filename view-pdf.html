<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title id="page-title">Document Viewer – Grandview Exchange</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <link rel="icon" type="image/png" href="assets/img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="shortcut icon" href="assets/img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="assets/img/site.webmanifest" />

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/global.js" defer></script>

    <style>
        .pdf-container {
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .pdf-embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-fallback-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
            background-color: var(--teal-light);
            border-radius: 6px;
            margin-bottom: var(--space-md);
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .pdf-container {
                height: 65vh;
                min-height: 400px;
            }

            .pdf-fallback-bar {
                flex-direction: column;
                gap: var(--space-xs);
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Site Banner -->
    <header class="site-header">
        <img src="assets/img/coverphoto.png" alt="Grandview Exchange Banner">
    </header>

    <div class="site-shell">

        <!-- GLOBAL NAV INCLUDE -->
        <div id="site-nav"></div>

        <!-- Page Header Summary -->
        <section class="page-intro-summary">
            <h1 id="doc-heading">Resident Resource Document</h1>
            <p class="lead-text">
                Review the document below. You can view it directly in your browser or download a copy to your device.
            </p>
        </section>

        <!-- Main Content Track -->
        <main class="main-content-area rich-text-area">
            <article class="section-block">

                <!-- Direct Download Bar -->
                <div class="pdf-fallback-bar">
                    <span>Having trouble viewing this file?</span>
                    <a id="pdf-download-btn" href="#" download class="btn-secondary"
                        style="padding: 0.25rem 0.75rem; font-size: 0.95rem; text-decoration: none;">
                        📥 Download PDF Copy
                    </a>
                </div>

                <!-- Embedded PDF Frame -->
                <div class="pdf-container" id="pdf-frame-wrapper">
                    <!-- Dynamically injected via JS -->
                </div>

            </article>
        </main>

    </div><!-- end site-shell -->

    <footer class="site-footer">
        <p>
            © 2026 Grandview Exchange ·
            Questions? <a href="mailto:admin@grandviewexchange.com">Contact Us</a>
        </p>
    </footer>

    <!-- Script to parse URL parameters and render the requested PDF -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const filePath = params.get('file');
            const titleParam = params.get('title') || 'Resident Resource Document';

            if (filePath) {
                // Update Title and Heading
                document.getElementById('doc-heading').textContent = titleParam;
                document.getElementById('page-title').textContent = titleParam + ' – Grandview Exchange';

                // Update Download Link
                const downloadBtn = document.getElementById('pdf-download-btn');
                downloadBtn.href = filePath;

                // Dynamically Inject PDF object/iframe
                const wrapper = document.getElementById('pdf-frame-wrapper');
                wrapper.innerHTML = `
					<object data="${filePath}" type="application/pdf" class="pdf-embed">
						<iframe src="${filePath}" class="pdf-embed">
							<p style="padding: 20px; text-align: center;">
								Your browser does not support embedded PDF files. 
								<a href="${filePath}">Click here to download the PDF file directly.</a>
							</p>
						</iframe>
					</object>
				`;
            } else {
                // Fallback if no file parameter is passed
                document.getElementById('doc-heading').textContent = 'Document Not Specified';
                document.getElementById('pdf-frame-wrapper').innerHTML = `
					<p style="padding: 40px; text-align: center; color: var(--text-muted);">
						No document path was provided. Please return to the <a href="resources.html">Resource Guide</a>.
					</p>
				`;
            }
        });
    </script>

</body>

</html>
