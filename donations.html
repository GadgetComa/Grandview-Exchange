<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- CHANGE THIS: Set the title of your document -->
    <title>Document Viewer – Grandview Exchange</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <link rel="icon" type="image/png" href="assets/img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
    <link rel="shortcut icon" href="assets/img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="assets/img/site.webmanifest" />

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Source+Sans+3:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/global.js" defer></script>

    <style>
        /* Custom Embedded PDF Container Styling */
        .pdf-container {
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .pdf-embed {
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-fallback-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-sm) var(--space-md);
            background-color: var(--teal-light);
            border-radius: 6px;
            margin-bottom: var(--space-md);
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .pdf-container {
                height: 65vh;
                min-height: 400px;
            }

            .pdf-fallback-bar {
                flex-direction: column;
                gap: var(--space-xs);
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- Site Banner -->
    <header class="site-header">
        <img src="assets/img/coverphoto.png" alt="Grandview Exchange Banner">
    </header>

    <div class="site-shell">

        <!-- GLOBAL NAV INCLUDE -->
        <div id="site-nav"></div>

        <!-- Page Header Summary -->
        <section class="page-intro-summary">
            <!-- CHANGE THIS: Set the Heading for the Document -->
            <h1>Resident Resource Document</h1>
            <!-- CHANGE THIS: Short description of what this document covers -->
            <p class="lead-text">
                Review the document below. You can view it directly in your browser or download a copy to your device.
            </p>
        </section>

        <!-- Main Content Track: Full Width Clean View -->
        <main class="main-content-area rich-text-area">
            <article class="section-block">

                <!-- Direct Download Bar (Useful for mobile devices or browsers with disabled PDF plugins) -->
                <div class="pdf-fallback-bar">
                    <span>Having trouble viewing this file?</span>
                    <!-- CHANGE THIS: Update the href path to your PDF file -->
                    <a href="assets/docs/YOUR-DOCUMENT-NAME.pdf" download class="btn-secondary"
                        style="padding: 0.25rem 0.75rem; font-size: 0.95rem; text-decoration: none;">
                        📥 Download PDF Copy
                    </a>
                </div>

                <!-- Embedded PDF Frame -->
                <div class="pdf-container">
                    <!-- CHANGE THIS: Update the data attribute path to your PDF file -->
                    <object data="assets/docs/Donation-Organizations.pdf" type="application/pdf" class="pdf-embed">
                        <!-- Mobile & Fallback iFrame -->
                        <!-- CHANGE THIS: Update the src attribute path to your PDF file -->
                        <iframe src="assets/docs/Donation-Organizations.pdf" class="pdf-embed">
                            <p style="padding: 20px; text-align: center;">
                                Your browser does not support embedded PDF files.
                                <a href="assets/docs/Donation-Organizations.pdf">Click here to download the PDF file
                                    directly.</a>
                            </p>
                        </iframe>
                    </object>
                </div>

            </article>
        </main>

    </div><!-- end site-shell -->

    <footer class="site-footer">
        <p>
            © 2026 Grandview Exchange ·
            Questions? <a href="mailto:admin@grandviewexchange.com">Contact Us</a>
        </p>
    </footer>

</body>

</html>
